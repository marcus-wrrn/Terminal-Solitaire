[package]
name = "solitaire"
version = "0.1.0"
edition = "2024"
authors = ["Marcus Warren"]
description = "A terminal-based solitaire game built with Rust and ratatui"
license = "MIT OR Apache-2.0"
repository = "https://github.com/marcuswrrn/solitaire"
keywords = ["game", "solitaire", "terminal", "tui", "cards"]
categories = ["games", "command-line-utilities"]
readme = "README.md"

[[bin]]
name = "solitaire"
path = "src/main.rs"

[dependencies]
ratatui = "0.29.0"
rand = "0.8"
crossterm = "0.28"
unicode-width = "0.2.0"
